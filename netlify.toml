[build]
  publish = "src"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/semantic-extract"
  to = "/.netlify/functions/semantic-extract"
  status = 200

[[redirects]]
  from = "/"
  to = "/app/index.html"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"
