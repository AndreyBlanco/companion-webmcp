<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Companion WebMCP synthetic demo</title>
<style>body{font:16px system-ui;max-width:760px;margin:2rem auto;padding:0 1rem}form,section{display:grid;gap:.7rem;margin:1.5rem 0;padding:1rem;border:1px solid #ccc;border-radius:.5rem}label{display:grid;gap:.25rem}input,textarea,button{font:inherit;padding:.55rem}textarea{min-height:7rem}pre{white-space:pre-wrap;background:#f4f4f4;padding:1rem}</style>
<h1>Companion WebMCP</h1>
<p>Synthetic, in-memory demonstration. Nothing persists until you select <em>Confirm and remember</em>.</p>
<p id="webmcp-status">Checking WebMCP…</p>
<form id="capture"><h2>1. Capture and structure</h2>
  <label>Subject ID <input id="subject-id" value="subject-orchid" required></label>
  <label>Display name <input id="subject-name" value="Orchid" required></label>
  <label>Observation <textarea id="raw-text" required>Observation: Orchid completed the blue maze.
Strategy: Started from the exit and worked backward.
Response: Smiled after finding the route.</textarea></label>
  <button>Preview draft</button>
</form>
<section><h2>2. Explicit confirmation</h2><button id="confirm" disabled>Confirm and remember</button><button id="cancel">Cancel draft</button></section>
<form id="search"><h2>3. Retrieve by subject</h2><label>Subject ID <input id="search-subject" value="subject-orchid" required></label><label>Question <input id="question" value="What strategy was used for the maze?" required></label><button>Search confirmed memory</button></form>
<pre id="output" aria-live="polite">No operation yet.</pre>
<script type="module" src="/app/client.js"></script>
</html>
